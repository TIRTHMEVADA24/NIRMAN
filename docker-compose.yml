version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nirmaan-postgres
    restart: always
    environment:
      POSTGRES_USER: nirmaan_user
      POSTGRES_PASSWORD: nirmaan_password
      POSTGRES_DB: nirmaan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nirmaan_user:nirmaan_password@postgres:5432/nirmaan?schema=public
      - JWT_SECRET=production_jwt_secret_change_me
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
