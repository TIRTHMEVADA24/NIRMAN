services:
  - type: web
    name: nirmaan-backend
    env: node
    buildCommand: cd backend && npm install && npm run prisma:generate && npm run build
    startCommand: cd backend && npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
